language: 'ko-KR'

tone_instructions: |
  React와 Next.js를 처음 배우는 개발자를 대상으로 리뷰해주세요.
  기본 원칙과 코드의 명확성을 우선해주세요.
  왜 문제가 되는지 간단히 설명해주세요.
  고급 최적화나 과도한 추상화를 무조건 권장하지 마세요.
  수정 방법뿐만 아니라 React와 Next.js의 기본 개념을 이해할 수 있도록 설명해주세요.

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  review_details: false
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: |
        React와 TypeScript의 기본적인 코드 품질을 중심으로 리뷰해주세요.

        React:
        - 컴포넌트의 책임이 명확한지 확인해주세요.
        - props와 state를 적절하게 사용했는지 확인해주세요.
        - 불필요한 useEffect 사용이 없는지 확인해주세요.
        - key를 올바르게 사용했는지 확인해주세요.
        - 컴포넌트가 지나치게 복잡하지 않은지 확인해주세요.
        - 중복되는 UI나 로직이 있는지 확인해주세요.
        - 과도한 컴포넌트 분리나 추상화는 지양해주세요.

        TypeScript:
        - any를 불필요하게 사용하지 않았는지 확인해주세요.
        - API 데이터에 적절한 타입이 정의되어 있는지 확인해주세요.
        - null과 undefined를 안전하게 처리하는지 확인해주세요.
        - 불필요한 타입 단언(as)을 사용하지 않았는지 확인해주세요.

        Next.js:
        - Server Component와 Client Component를 적절하게 구분했는지 확인해주세요.
        - "use client"가 정말 필요한지 확인해주세요.
        - 서버에서 처리할 수 있는 작업을 불필요하게 클라이언트에서 처리하지 않는지 확인해주세요.
        - Next.js의 기본 기능을 적절하게 활용하고 있는지 확인해주세요.

        기본 원칙:
        - 동작 여부뿐 아니라 읽기 쉬운 코드인지 확인해주세요.
        - 복잡한 구현보다 단순하고 명확한 구현을 우선해주세요.
        - 성능 최적화는 실제 문제가 있거나 명확한 개선 효과가 있을 때만 제안해주세요.
        - 단순한 코드에 불필요한 디자인 패턴이나 추상화를 적용하지 않도록 해주세요.
chat:
  auto_reply: true
